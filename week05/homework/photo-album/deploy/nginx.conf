worker_processes 1;
error_log logs/photo-album-error.log;
pid logs/photo-album.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log logs/photo-album-access.log;
    client_body_temp_path client_body_temp;
    proxy_temp_path proxy_temp;
    fastcgi_temp_path fastcgi_temp;
    uwsgi_temp_path uwsgi_temp;
    scgi_temp_path scgi_temp;

    server {
        listen 127.0.0.1:8088;
        server_name localhost 127.0.0.1;
        root "__PHOTO_ALBUM_DIST__";
        index index.html;

        # Allow multipart overhead above the application's 5 MiB file limit.
        client_max_body_size 6m;
        error_page 413 = @upload_too_large;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
        }

        # Pass cookies and the original path to Gin for per-photo authorization.
        location /uploads/ {
            proxy_pass http://127.0.0.1:8080;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location @upload_too_large {
            default_type application/json;
            return 413 '{"code":413,"message":"request is too large","data":{}}';
        }
    }
}
